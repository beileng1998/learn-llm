[concepts]
notebook-cell = "a page is made of cells; Shift + Enter runs a code cell and shows its last line's result below it"
error-message = "a red error box means Python couldn't follow an instruction; read the last line, fix, re-run"
arithmetic = "+ - * / on numbers, typed with * and / (not × ÷)"
operator-precedence = "* and / happen before + and -; parentheses go first"
power = "a ** b multiplies a by itself b times"
variable = "name = value stores a value under a name; = means store, not equals; one cell per name"
naming-rules = "you choose names: letters, digits and _, no spaces"
function = "def name(input): followed by indented steps; a named recipe"
call = "name(input) runs a function with that input and gives its answer; a function can call another"
return = "return value gives the answer back from a function"
indentation = "lines belonging to a def/for/if are pushed in 4 more spaces; the editor indents after :, Backspace un-indents"
comment = "# starts a note for humans that Python ignores"
todo-placeholder = "todo() marks code the learner still has to write"
list = "[a, b, c] holds several values in order"
builtin-len = "len(list) gives how many values a list holds"
loop = "for item in list: runs the indented lines once per value"
if = "if condition: runs the indented lines only when the condition is true"
comparison = "a > b, a < b give true or false"
mean = "the average: total divided by how many values"
builtin-zip = "zip(xs, ys) pairs up two lists position by position"
tuple = "for a, b in ...: takes two values at a time, one for each name"
builtin-print = "print(...) shows values as text under the cell, every time it runs"
chart-reading = "x-axis (bottom) measures the first number, y-axis (left) the second; each dot is one pair"
model = "a recipe with adjustable numbers that turns an input into a guess"
parameter = "a model's adjustable numbers (its knobs); learning means finding good values for them"
line = "guess = w * x + b: w is the steepness, b the starting height (the guess at x = 0)"
error = "guess minus truth; positive means too high, negative too low"
squaring = "a number times itself; never negative, and big numbers grow much bigger"
loss = "a number measuring how wrong a model is; lower is better"
mse = "mean squared error: the average of the squared errors over all examples"
update-variable = "x = x + 1: Python works out the right side with the old x, then stores the result back in x"
nudge = "a tiny change to an input (like 0.0001) to see how the output changes"
rate = "one change divided by another: how much of this per one of that"
slope = "(f(x + h) - f(x)) / h: how much the output changes per unit of input, right here; sign = direction, size = steepness"
function-as-value = "a function can be handed to another function as an input (no parentheses), and called inside it"
step-rule = "new w = w - rate * slope: the minus makes the step go downhill"
learning-rate = "the small number that sets the step size: too small is slow, too big overshoots or flies off"
builtin-range = "for i in range(n): repeats the indented lines n times"
gradient-descent = "repeat: measure the slope, take a step downhill"
expanding-square = "(x + h) x (x + h) = x x x + 2 x x x h + h x h, seen as a square cut into four pieces"
derivative = "the exact slope, as the nudge shrinks to nothing; written d/dx; d/dx(x^2) = 2x"
derivative-rules = "constant: 0; c * x: c; x * x: 2 * x; c * f: c times f's slope; f + g: slopes add"
computation-graph = "a calculation drawn as boxes (values) and arrows (which values make which), one small step per box"
local-slope = "for one arrow: how much the result moves per unit nudge of one input, everything else held still"
chain-rule = "rates along a path multiply, like chaining currency exchange rates"
blame = "a box's blame: how much the final loss moves per unit this box moves (its slope of the loss)"
backpropagation = "walk the graph backwards: blame of a box = local slope of its arrow x blame of the box it points to"
gradient = "the slopes of the loss for all the knobs together"
blames-add = "when a value feeds several arrows, the blames arriving through each arrow add up"
two-sided-product = "in a x c, nudging a moves the result by c per unit, nudging c moves it by a"
return-pair = "return a, b gives back two values; x, y = f(...) catches both"
gradient-check = "compare a hand-written gradient against nudging"
class = "class Name: a recipe for a new kind of value with named slots; Name(...) makes one"
init-and-self = "def __init__(self, ...): runs when a new value is made; self is the value being set up"
attribute = "a named slot inside a value, read and stored with a dot: v.data, v.grad = 0"
list-append = "list.append(x) adds x to the end of the list"
builtin-reversed = "for x in reversed(list): goes from the last entry to the first"
recording-book = "while a calculation runs, every step is written in a list (the book) in order"
reverse-order = "a box is written after the boxes it was made from, so reading the book backwards reaches every user of a value before the value itself"
fresh-boxes = "backward adds to blames, so every new calculation needs fresh Value boxes with blame 0"
curve-model = "guess = a * x * x + w * x + b: a curve that can rise and then fall"
centering-inputs = "measuring inputs from the middle in sensible units (like (t - 25) / 10) keeps all knobs on a similar footing"
multi-input-model = "guess = w_t × t + w_r × rain + w_k × weekend + b: one knob per input"
vector = "a list of numbers, like the knobs [12, -8, 4] or one day's inputs [17, 1, 0]"
dot-product = "multiply two vectors in pairs and add up the products: dot([1, 2], [3, 4]) = 11"
matrix = "a table of numbers: one row per example (day), one column per input"
list-of-lists = "a matrix in plain Python: rows = [[14, 0, 0], [17, 1, 0], ...]; for row in rows: gives one row at a time"
shape = "rows then columns: (8, 3); a vector of 8 numbers has shape (8,)"
numpy = "a library for maths on whole arrays, loaded as np; its tools are reached with np."
numpy-array = "np.array(list) makes a vector or matrix array; X.shape gives its shape"
elementwise = "on arrays, + - * / work position by position, and a single number works against every position; on lists, + glues"
matmul-operator = "X @ w: dot product of every row of X with w; v @ w between two vectors is their dot product"
shape-rule = "(8, 3) @ (3,) gives (8,): the inner sizes must match and disappear; otherwise a matmul error"
numpy-mean = "np.mean(array) is the mean of all its numbers"
vector-times-matrix = "v @ X: dot product of v with every column of X; (8,) @ (8, 3) gives (3,)"
vectorized-gradient = "grad_w = (2 * e) @ X / n, grad_b = np.mean(2 * e): each knob's slope is the mean of 2e times its own input"
broadcasting = "a smaller array used against every row: X - np.array([25, 0, 0]) subtracts 25 from each row's first column"
