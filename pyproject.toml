[project]
name = "learn-llm"
version = "0.0.1"
description = "From zero to your own LLM stack, in the browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CONTENT"]
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.25.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learn_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Course-wide marimo settings: run every lesson as soon as it opens, save the learner's edits.
[tool.marimo.runtime]
auto_instantiate = true
on_cell_change = "autorun"

# Results show under the code that made them, as the lessons describe.
[tool.marimo.display]
cell_output = "below"

[tool.marimo.save]
autosave = "after_delay"
